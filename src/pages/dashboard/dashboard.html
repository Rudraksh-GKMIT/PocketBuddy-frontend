<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dashboard - Family Expense Tracker</title>
    <style>
        .navbar {
            position: sticky;
            top: 0;
            z-index: 999;
        }
    </style>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main Dashboard Module (Updated) -->
    <script type="module" src="/src/pages/dashboard/dashboard.js"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Family Expense Tracker</a>
            <div id="navLinks"></div>
        </div>
    </nav>

    <div class="container mt-5">

        <h2 class="text-center mb-4" id="welcomeText">Welcome!</h2>

        <!-- SUMMARY CARDS -->
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>Total Spent</h5>
                        <h2 id="totalSpent" class="text-primary">₹0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>This Month</h5>
                        <h2 id="monthlySpent" class="text-success">₹0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>Most Spent Category</h5>
                        <h3 id="topCategory">-</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- CATEGORY BREAKDOWN -->
        <div class="card shadow mt-5">
            <div class="card-body">
                <h4>Category-wise Spending</h4>
                <ul id="categoryList" class="list-group mt-3"></ul>
            </div>
        </div>

    </div>

</body>

</html>
