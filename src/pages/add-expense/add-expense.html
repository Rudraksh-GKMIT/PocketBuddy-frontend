<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Expense - Family Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    <style>
        .navbar {
            position: sticky;
            top: 0;
            z-index: 999;
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <!-- JS Files -->
    <script type="module" src="../../api.js"></script>
    <script type="module" src="../../auth/auth.js"></script>
    <script type="module" src="./add-expense.js"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../dashboard/dashboard.html">Family Expense Tracker</a>
            <div id="navLinks"></div>
        </div>
    </nav>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Add New Expense</h2>

        <!-- ERROR BOX -->
        <div id="errorBox" class="alert alert-danger d-none"></div>

        <div class="card shadow-sm col-md-6 mx-auto">
            <div class="card-body">

                <form id="expenseForm">

                    <!-- CATEGORY -->
                    <div class="mb-3">
                        <label class="form-label">Category<span class="text-danger">*</span></label>
                        <select id="category" class="form-select" required>
                            <option value="">Select Category</option>
                            <option value="food">Food</option>
                            <option value="travel">Travel</option>
                            <option value="shopping">Shopping</option>
                            <option value="bills">Bills</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- AMOUNT -->
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)<span class="text-danger">*</span></label>
                        <input type="number" id="amount" class="form-control" required min="1" step="0.01" ">
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="mb-3">
                        <label class="form-label">Description<span class="text-danger">*</span></label>
                        <textarea id="description" class="form-control" required rows="3"></textarea>
                    </div>

                    <button class="btn btn-primary w-100 mt-3">
                        Add Expense
                    </button>

                </form>

            </div>
        </div>

    </div>

    <!-- SUCCESS TOAST (TOP RIGHT) -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="successToastMessage">
                    Success!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js")
            .then(() => console.log("PWA ready"))
            .catch(err => console.log("SW error:", err));
        }
        </script>

</body>
</html>
