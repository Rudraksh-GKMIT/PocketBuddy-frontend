<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Register - Family Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JS Files -->
    <script type="module" src="../../constant/label.js"></script>
    <script type="module" src="../../api.js"></script>
    <script type="module" src="../../auth/auth.js"></script>
    <script type="module" src="./register.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="col-md-5 mx-auto">

            <div class="card shadow-sm">
                <div class="card-body">

                    <!-- Dynamic Title -->
                    <h3 id="registerTitle" class="text-center mb-4"></h3>

                    <!-- Error Box -->
                    <div id="errorBox" class="alert alert-danger d-none"></div>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label>Family Name</label>
                            <input type="text" id="familyName" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Your Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                        <button class="btn btn-success w-100 mt-3">Register</button>
                    </form>

                    <!-- Footer Text (Dynamic) -->
                    <p class="mt-3 text-center">
                        <span id="alreadyHaveAccount"></span>
                        <a id="loginLinkText" href="../login/login.html"></a>
                    </p>

                </div>
            </div>

        </div>
    </div>

</body>

</html>
