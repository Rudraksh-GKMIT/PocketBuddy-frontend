<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login - Family Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JS Files -->
    <script defer src="../js/api.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/login.js"></script>
</head>

<body class="bg-light"> <!-- This set whole background colour to light grey -->

    <div class="container mt-5"> <!-- This is a main caintainer with center content and top margin-top -->
        <div class="col-md-4 mx-auto">  <!-- This is a box of 4/12 width with center horizontally -->

            <div class="card shadow-sm"><!-- This create a wite box with border and padding with small shadow -->
                 <div class="card-body">
                    <h3 class="text-center mb-4">Login</h3>

                    <div id="errorBox" class="alert alert-danger d-none"></div>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
