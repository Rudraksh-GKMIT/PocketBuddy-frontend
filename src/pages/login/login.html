<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login - Family Expense Tracker</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JS Files -->
    <script type="module" src="../../constant/label.js"></script>
    <script type="module" src="../../constant/api_path.js"></script>
    <script type="module" src="../../constant/keys.js"></script>
    <script type="module" src="../../auth/auth.js"></script>
    <script type="module" src="./login.js"></script>


</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="col-md-4 mx-auto">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h3 id="loginTitle" class="text-center mb-4"></h3>

                    <div id="errorBox" class="alert alert-danger d-none"></div>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                        <button class="btn btn-primary w-100 mt-3">Login</button>
                    </form>

                    <p class="mt-3 text-center">
                        <span id="noAccountText"></span>
                        <a id="registerText" href="/src/pages/register/register.html"></a>
                    </p>

                </div>
            </div>

        </div>
    </div>
    <script>
    if ("serviceWorker" in navigator) {
    navigator.serviceWorker
        .register("/service-worker.js")
        .catch(err => console.log("SW registration failed", err));
    }
    </script>


</body>

</html>
