<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Family Dashboard - Family Expense Tracker</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .navbar {
            position: sticky;
            top: 0;
            z-index: 999;
        }
    </style>

    <!-- JS Files -->
    <script type="module" src="../../api.js"></script>
    <script type="module" src="../../auth/auth.js"></script>
    <script type="module" src="./family-summary.js"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../dashboard/dashboard.html">Family Expense Tracker</a>
            <div id="navLinks"></div>
        </div>
    </nav>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Family Dashboard</h2>

        <div id="errorBox" class="alert alert-danger d-none"></div>

        <!-- SUMMARY CARDS -->
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>Total Family Spending</h5>
                        <h2 id="totalFamilySpent" class="text-primary">₹0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>This Month Spending</h5>
                        <h2 id="familyMonthlySpent" class="text-success">₹0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <h5>Top Category</h5>
                        <h3 id="familyTopCategory">-</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- CATEGORY BREAKDOWN -->
        <div class="card shadow mt-5">
            <div class="card-body">
                <h4>Category Breakdown</h4>
                <ul id="familyCategoryList" class="list-group mt-3"></ul>
            </div>
        </div>

        <!-- FILTER + FAMILY EXPENSES TABLE -->
        <div class="mt-5">
            <h4 class="mb-3">All Family Expenses</h4>

            <div class="mb-3 w-25">
                <select id="categoryFilter" class="form-select">
                    <option value="all">All Categories</option>
                    <option value="food">Food</option>
                    <option value="travel">Travel</option>
                    <option value="shopping">Shopping</option>
                    <option value="bills">Bills</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <table class="table table-bordered table-striped text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Member</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Description</th>
                                <th>Date</th>
                            </tr>
                        </thead>

                        <tbody id="familyExpenseTableBody">
                            <!-- Loaded by JS -->
                        </tbody>
                    </table>

                </div>
            </div>
        </div>

    </div>
    <script>
    if ("serviceWorker" in navigator) {
    navigator.serviceWorker
        .register("/service-worker.js")
        .catch(err => console.log("SW registration failed", err));
    }
    </script>


</body>
</html>
