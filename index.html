<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PocketBuddy - Family Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--CSS  -->
    <style>
        body {
            background: #f5f7fa;
        }
        .hero {
            margin-top: 10vh;
        }
        .btn-custom {
            padding-left: 25px;
            padding-right: 25px;
        }
    </style>
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#0d6efd">


</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand">PocketBuddy</span>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="container hero text-center">
        <h1 class="mb-3">Welcome to PocketBuddy</h1>
        <p class="lead text-muted">
            A simple and smart way to manage your family expenses.
        </p>

        <div class="mt-4">
            <a href="./src/pages/login/login.html" class="btn btn-primary btn-lg btn-custom">Login</a>
            <a href="./src/pages/register/register.html" class="btn btn-outline-primary btn-lg btn-custom ms-2">Register</a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center mt-5 mb-3 text-muted">
        2025 PocketBuddy | Track • Save • Manage
    </footer>
    
    <script type="module">
    import { isLoggedIn } from "./src/auth/auth.js";

    // If user already logged in → redirect to dashboard
    if (isLoggedIn()) {
        window.location.href = "/src/pages/dashboard/dashboard.html";
    }
    
    </script>
    <script>
    if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
        .then(() => console.log("PWA ready"))
        .catch(err => console.log("SW error:", err));
    }
    </script>

</body>
</html>
